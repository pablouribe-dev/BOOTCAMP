# Configuracion del microservicio de tarjetas de credito.

server:
  port: 8084

spring:
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/bank_credit_cards}
      auto-index-creation: true
  # Parte III: tipo por defecto del sobre (sin type headers).
  kafka:
    consumer:
      properties:
        spring.json.value.default.type: com.bank.creditcard.event.EventEnvelope
        spring.json.trusted.packages: com.bank.creditcard.event

bank:
  services:
    customer-service-url: ${CUSTOMER_SERVICE_URL:http://bank-customer-service}
  rules:
    # Prefijo usado al generar el numero de tarjeta.
    card-number-prefix: "4532"
  # Parte III: deteccion diaria de deudas vencidas (01:00 todos los dias).
  debts:
    overdue-scan-cron: ${OVERDUE_SCAN_CRON:0 0 1 * * *}
  # Publica deudas vencidas de tarjetas y consume las de todos los productos
  # (regla de adquisicion con copia local).
  kafka:
    published:
      - debt-events
    consumed:
      - debt-events
