# Unica configuracion local: el nombre de la aplicacion y donde esta el
# Config Server. Todo lo demas (puerto, URI de Mongo, Kafka) llega desde
# bank-config-repo/bank-debit-card-service.yml.

spring:
  application:
    name: bank-debit-card-service
  config:
    import: configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      fail-fast: true
