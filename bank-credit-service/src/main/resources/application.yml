# Unica configuracion local: el nombre de la aplicacion y donde esta el
# Config Server. Todo lo demas (puerto, URI de Mongo, URL de customer-service,
# limites de negocio) llega desde bank-config-repo/bank-credit-service.yml.

spring:
  application:
    name: bank-credit-service
  config:
    import: configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      fail-fast: true
